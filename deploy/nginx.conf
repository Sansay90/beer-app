# brewapp за nginx на сервере: /etc/nginx/sites-available/brewapp, включён ссылкой из sites-enabled.
# HTTPS — сертификат certbot (продлевается плагином nginx по server_name). Сервис слушает 127.0.0.1:8000.
# Поток событий интерфейса (SSE) и WebSocket агентов держатся часами — им отдельные настройки.
# proxy_set_header наследуется, только если в location нет своих, — поэтому заголовки в каждом блоке.
server {
    listen 80 default_server;
    server_name 151-243-208-72.sslip.io;
    return 301 https://151-243-208-72.sslip.io$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name 151-243-208-72.sslip.io;
    ssl_certificate /etc/letsencrypt/live/151-243-208-72.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/151-243-208-72.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;                 # фото пива — до 10 МБ
    proxy_http_version 1.1;

    # агенты пивоварен
    location = /api/agent {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # поток событий интерфейса
    location = /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
