# Проверка на каждый пуш и pull request; пуш в main после проверки ещё собирается в образы (сервис и интерфейс)
# и выкатывается на сервер по SSH. Сервер и его настройка — deploy/README.md. Секреты репозитория: DEPLOY_HOST, DEPLOY_SSH_KEY
# (ключ пользователя deploy на сервере), DEPLOY_KNOWN_HOSTS (отпечаток сервера), DEPLOY_URL (адрес сайта).
name: Проверка и выкатка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  python:
    name: Сервис и агент
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brewapp
          POSTGRES_PASSWORD: brewapp
          POSTGRES_DB: brewapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewapp -d brewapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://brewapp:brewapp@127.0.0.1:5432/brewapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            service/requirements*.txt
            agent/requirements*.txt
      - name: Зависимости
        run: pip install -r service/requirements-dev.txt -r agent/requirements-dev.txt
      - name: Линтер
        run: ruff check service agent shared
      - name: Тесты агента
        working-directory: agent
        run: pytest
      - name: Тесты сервиса
        working-directory: service
        run: pytest
      - name: Схема API в web совпадает с сервисом
        working-directory: service
        run: |
          python -m app openapi ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json || { echo "::error::web/openapi.json устарел — в web: npm run api:types"; exit 1; }

  web:
    name: Интерфейс
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Линтер
        run: npm run lint
      - name: Тесты
        run: npm run test
      # типы API генерирует nuxt-open-fetch из openapi.json (npm ci → nuxt prepare); что openapi.json совпадает
      # с сервисом, проверяет job «Сервис и агент»
      - name: Типы
        run: npm run typecheck

  build:
    name: Образ ${{ matrix.name }}
    needs: [python, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: сервиса, context: service, image: ghcr.io/sansay90/beer-app }
          - { name: интерфейса, context: web, image: ghcr.io/sansay90/beer-app-web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  deploy:
    name: Сервер
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Доступ к серверу
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выкатить
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/deploy deploy/compose.yaml "deploy@$HOST:/opt/brewapp/compose.yaml"
          # образ закрытый: вход в реестр — токеном этой выкатки, после неё он уже недействителен и стирается
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy "deploy@$HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin \
             && cd /opt/brewapp \
             && export APP_TAG=${{ github.sha }} \
             && docker compose pull app web \
             && docker compose up -d --remove-orphans \
             ; status=\$?; docker logout ghcr.io; docker image prune -f; exit \$status"
      - name: Сайт отвечает
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$URL/api/health"
