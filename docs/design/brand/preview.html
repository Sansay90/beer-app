<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hoplab — эскизы знака</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Inter, Arial, sans-serif; background: #F6EBD4; color: #2B1B12; }
  .row { display: flex; gap: 20px; padding: 22px 24px; align-items: center; flex-wrap: wrap; }
  .dark { background: #1A110B; color: #F6EBD4; }
  .card { width: 170px; text-align: center; }
  .card img { width: 130px; height: 130px; }
  .small img { width: 32px; height: 32px; margin-right: 18px; }
  .lockup { display: flex; align-items: center; gap: 12px; font-size: 42px; font-weight: 800; letter-spacing: -1px; margin-right: 36px; }
  .lockup img { width: 60px; height: 60px; }
  .lab { font-family: Consolas, 'JetBrains Mono', monospace; font-weight: 400; color: #B8761A; }
  .dark .lab { color: #E8A33A; }
  h2 { font-size: 14px; font-weight: 600; margin: 6px 0 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="card"><img src="a-flask-hops.svg"><h2>А. Колба с хмелем</h2></div>
    <div class="card"><img src="d-flask-cone.svg"><h2>Б. Шишка в колбе</h2></div>
    <div class="card"><img src="b-hop-scale.svg"><h2>В. Мерная шишка</h2></div>
    <div class="card"><img src="c-beaker-glass.svg"><h2>Г. Мензурка-бокал</h2></div>
    <div class="card"><img src="e-app-icon.svg"><h2>Д. Иконка приложения</h2></div>
  </div>
  <div class="row dark">
    <div class="card"><img src="a-flask-hops-dark.svg"></div>
    <div class="card"><img src="d-flask-cone-dark.svg"></div>
    <div class="card"><img src="b-hop-scale-dark.svg"></div>
    <div class="card"><img src="c-beaker-glass-dark.svg"></div>
    <div class="card"><img src="e-app-icon.svg"></div>
  </div>
  <div class="row small">
    <img src="a-flask-hops.svg"><img src="d-flask-cone.svg"><img src="b-hop-scale.svg"><img src="c-beaker-glass.svg"><img src="e-app-icon.svg">
  </div>
  <div class="row">
    <div class="lockup"><img src="a-flask-hops.svg"><span>hop<span class="lab">lab</span></span></div>
    <div class="lockup"><img src="d-flask-cone.svg"><span>Hoplab</span></div>
    <div class="lockup"><img src="c-beaker-glass.svg"><span>hop<span class="lab">lab</span></span></div>
  </div>
  <div class="row dark">
    <div class="lockup"><img src="a-flask-hops-dark.svg"><span>hop<span class="lab">lab</span></span></div>
    <div class="lockup"><img src="d-flask-cone-dark.svg"><span>Hoplab</span></div>
    <div class="lockup"><img src="c-beaker-glass-dark.svg"><span>hop<span class="lab">lab</span></span></div>
  </div>
</body>
</html>
