<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hoplab — логотипы с названием, подборка 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@800;900&family=Oswald:wght@500;700&family=Unbounded:wght@500;800&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<style>
  :root { --malt: #2B1B12; --amber: #E8A33A; --hop: #7C9A3C; --foam: #F6EBD4; --rust: #9A3412; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--foam); color: var(--malt); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 26px 32px; border-bottom: 1px solid #e3d5b8; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .dark { background: #1A110B; color: var(--foam); border-color: #2c1f15; }
  .tag { font-size: 13px; font-weight: 600; opacity: .7; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="cone" viewBox="0 0 40 56">
      <path d="M20 4 C30 4 36 12 36 22 C36 36 29 46 20 54 C11 46 4 36 4 22 C4 12 10 4 20 4 Z" fill="var(--amber)"/>
      <path d="M8 18 C12 24 16 24 20 18 C24 24 28 24 32 18 M6 30 C10 37 15 37 20 30 C25 37 30 37 34 30 M10 42 C13 48 17 48 20 43 C23 48 27 48 30 42" fill="none" stroke="var(--malt)" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
      <path d="M20 4 C20 0 23 -2 27 -3" fill="none" stroke="var(--hop)" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- колос -->
    <symbol id="wheat" viewBox="0 0 30 90">
      <path d="M15 88 V12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <g fill="currentColor">
        <ellipse cx="9" cy="24" rx="5" ry="9" transform="rotate(-25 9 24)"/><ellipse cx="21" cy="24" rx="5" ry="9" transform="rotate(25 21 24)"/>
        <ellipse cx="9" cy="42" rx="5" ry="9" transform="rotate(-25 9 42)"/><ellipse cx="21" cy="42" rx="5" ry="9" transform="rotate(25 21 42)"/>
        <ellipse cx="9" cy="60" rx="5" ry="9" transform="rotate(-25 9 60)"/><ellipse cx="21" cy="60" rx="5" ry="9" transform="rotate(25 21 60)"/>
        <ellipse cx="15" cy="9" rx="4.5" ry="9"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="grid">
  <!-- 11. винтажная эмблема с лентой -->
  <div class="cell"><div class="tag">11. Винтажная эмблема: дуга, лента с названием, хмель и колосья</div>
    <svg viewBox="0 0 320 230" width="320" style="color:var(--malt)">
      <path id="arcTop" d="M60 128 A100 100 0 0 1 260 128" fill="none"/>
      <text font-family="Oswald" font-weight="500" font-size="17" letter-spacing="5" fill="currentColor" text-anchor="middle"><textPath href="#arcTop" startOffset="50%">ЛАБОРАТОРИЯ ПИВОВАРА</textPath></text>
      <use href="#wheat" x="70" y="62" width="26" height="80" transform="rotate(-18 83 102)"/>
      <use href="#wheat" x="224" y="62" width="26" height="80" transform="rotate(18 237 102)"/>
      <use href="#cone" x="141" y="50" width="38" height="54"/>
      <path d="M22 128 L52 120 L52 168 L22 176 L36 152 Z" fill="var(--rust)"/>
      <path d="M298 128 L268 120 L268 168 L298 176 L284 152 Z" fill="var(--rust)"/>
      <path d="M46 116 H274 V164 H46 Z" fill="currentColor"/>
      <text x="160" y="155" text-anchor="middle" font-family="Bitter" font-weight="900" font-size="40" letter-spacing="3" fill="var(--foam)">HOPLAB</text>
      <text x="160" y="198" text-anchor="middle" font-family="Oswald" font-weight="500" font-size="15" letter-spacing="6" fill="currentColor">★ EST. 2026 ★</text>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 320 230" width="320" style="color:var(--foam)">
      <path id="arcTop2" d="M60 128 A100 100 0 0 1 260 128" fill="none"/>
      <text font-family="Oswald" font-weight="500" font-size="17" letter-spacing="5" fill="currentColor" text-anchor="middle"><textPath href="#arcTop2" startOffset="50%">ЛАБОРАТОРИЯ ПИВОВАРА</textPath></text>
      <use href="#wheat" x="70" y="62" width="26" height="80" transform="rotate(-18 83 102)"/>
      <use href="#wheat" x="224" y="62" width="26" height="80" transform="rotate(18 237 102)"/>
      <use href="#cone" x="141" y="50" width="38" height="54"/>
      <path d="M22 128 L52 120 L52 168 L22 176 L36 152 Z" fill="var(--rust)"/>
      <path d="M298 128 L268 120 L268 168 L298 176 L284 152 Z" fill="var(--rust)"/>
      <path d="M46 116 H274 V164 H46 Z" fill="var(--amber)"/>
      <text x="160" y="155" text-anchor="middle" font-family="Bitter" font-weight="900" font-size="40" letter-spacing="3" fill="var(--malt)">HOPLAB</text>
      <text x="160" y="198" text-anchor="middle" font-family="Oswald" font-weight="500" font-size="15" letter-spacing="6" fill="currentColor">★ EST. 2026 ★</text>
    </svg>
  </div>

  <!-- 12. лабораторный штамп -->
  <div class="cell"><div class="tag">12. Лабораторный штамп «образец №» — одной краской, слегка повёрнут</div>
    <svg viewBox="0 0 360 170" width="340" style="color:var(--rust)">
      <g transform="rotate(-4 180 85)">
        <rect x="10" y="12" width="340" height="146" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>
        <rect x="22" y="24" width="316" height="122" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="180" y="54" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="14" letter-spacing="4" fill="currentColor">ОБРАЗЕЦ № 001 · ПАРТИЯ 26</text>
        <text x="180" y="112" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="66" letter-spacing="10" fill="currentColor">HOPLAB</text>
        <text x="180" y="136" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="12.5" letter-spacing="3" fill="currentColor">ЛАБОРАТОРИЯ ДОМАШНЕГО ПИВОВАРА</text>
      </g>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 360 170" width="340" style="color:var(--amber)">
      <g transform="rotate(-4 180 85)">
        <rect x="10" y="12" width="340" height="146" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>
        <rect x="22" y="24" width="316" height="122" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="180" y="54" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="14" letter-spacing="4" fill="currentColor">ОБРАЗЕЦ № 001 · ПАРТИЯ 26</text>
        <text x="180" y="112" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="66" letter-spacing="10" fill="currentColor">HOPLAB</text>
        <text x="180" y="136" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="12.5" letter-spacing="3" fill="currentColor">ЛАБОРАТОРИЯ ДОМАШНЕГО ПИВОВАРА</text>
      </g>
    </svg>
  </div>

  <!-- 13. элемент таблицы Менделеева -->
  <div class="cell"><div class="tag">13. Элемент таблицы Менделеева «Hl» и надпись рядом</div>
    <svg viewBox="0 0 400 130" width="380" style="color:var(--malt)">
      <rect x="4" y="6" width="116" height="118" rx="10" fill="var(--amber)"/>
      <text x="16" y="32" font-family="JetBrains Mono" font-weight="600" font-size="15" fill="var(--malt)">26</text>
      <text x="106" y="32" text-anchor="end" font-family="JetBrains Mono" font-weight="600" font-size="11" fill="var(--malt)">1.048</text>
      <text x="62" y="92" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="56" letter-spacing="-2" fill="var(--malt)">Hl</text>
      <text x="62" y="114" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10.5" letter-spacing="1" fill="var(--malt)">ХОПЛАБ</text>
      <text x="140" y="80" font-family="Unbounded" font-weight="800" font-size="58" letter-spacing="-2" fill="currentColor">hoplab</text>
      <text x="142" y="108" font-family="JetBrains Mono" font-weight="600" font-size="13" letter-spacing="1.5" fill="currentColor" opacity=".75">лаборатория домашнего пивовара</text>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 400 130" width="380" style="color:var(--foam)">
      <rect x="4" y="6" width="116" height="118" rx="10" fill="var(--amber)"/>
      <text x="16" y="32" font-family="JetBrains Mono" font-weight="600" font-size="15" fill="var(--malt)">26</text>
      <text x="106" y="32" text-anchor="end" font-family="JetBrains Mono" font-weight="600" font-size="11" fill="var(--malt)">1.048</text>
      <text x="62" y="92" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="56" letter-spacing="-2" fill="var(--malt)">Hl</text>
      <text x="62" y="114" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10.5" letter-spacing="1" fill="var(--malt)">ХОПЛАБ</text>
      <text x="140" y="80" font-family="Unbounded" font-weight="800" font-size="58" letter-spacing="-2" fill="currentColor">hoplab</text>
      <text x="142" y="108" font-family="JetBrains Mono" font-weight="600" font-size="13" letter-spacing="1.5" fill="currentColor" opacity=".75">лаборатория домашнего пивовара</text>
    </svg>
  </div>
</div>
</body>
</html>
