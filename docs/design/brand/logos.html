<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hoplab — логотипы с названием</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Fraunces:opsz,wght@72,800&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --malt: #2B1B12; --amber: #E8A33A; --hop: #7C9A3C; --foam: #F6EBD4; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--foam); color: var(--malt); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { padding: 28px 32px; border-bottom: 1px solid #e3d5b8; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .dark { background: #1A110B; color: var(--foam); border-color: #2c1f15; }
  .tag { font-size: 13px; font-weight: 600; opacity: .7; }
  svg { display: block; }
  .header { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-radius: 12px; background: #fff8ea; }
  .dark .header { background: #241810; }
  .header small { font-size: 13px; opacity: .65; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- колба вместо «A»: перекладина — уровень пива -->
    <symbol id="flaskA" viewBox="0 0 64 80">
      <path d="M22 30 L6 72 Q4 78 10 78 H54 Q60 78 58 72 L42 30 Z" fill="var(--amber)" clip-path="url(#liquid)"/>
      <path d="M24 4 V30 L5 72 Q3 78 10 78 H54 Q61 78 59 72 L40 30 V4" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M17 4 H47" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M13 52 H51" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M40 6 C42 -4 56 -8 64 -3 C59 6 49 9 40 6 Z" fill="var(--hop)"/>
    </symbol>
    <clipPath id="liquid"><rect x="0" y="52" width="64" height="28"/></clipPath>
    <!-- шишка вместо «o» -->
    <symbol id="cone" viewBox="0 0 60 80">
      <path d="M30 14 C45 15 54 28 53 42 C52 58 43 69 30 78 C17 69 8 58 7 42 C6 28 15 15 30 14 Z" fill="var(--amber)"/>
      <path d="M13 36 Q21.5 46 30 36 Q38.5 46 47 36 M10 52 Q20 63 30 52 Q40 63 50 52 M18 66 Q24 74 30 66 Q36 74 42 66" fill="none" stroke="var(--foam)" stroke-width="4" stroke-linecap="round"/>
      <path d="M30 14 C30 7 34 3 40 2" fill="none" stroke="var(--hop)" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <!-- пробирка вместо «l» -->
    <symbol id="tube" viewBox="0 0 30 100">
      <path d="M6 52 V86 Q6 96 15 96 Q24 96 24 86 V52 Z" fill="var(--amber)"/>
      <path d="M6 52 Q10 46 15 52 Q20 46 24 52" fill="var(--foam)" stroke="var(--foam)" stroke-width="2"/>
      <path d="M6 4 V86 Q6 96 15 96 Q24 96 24 86 V4" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 4 H29" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="grid">
  <!-- 1. HOPLAB с колбой вместо A -->
  <div class="cell"><div class="tag">1. Колба вместо «A» — уровень пива как перекладина</div>
    <svg viewBox="0 0 420 100" width="420" style="color:var(--malt)">
      <text x="0" y="82" font-family="Unbounded" font-weight="800" font-size="78" letter-spacing="-2" fill="currentColor">HOPL</text>
      <use href="#flaskA" x="247" y="10" width="70" height="82"/>
      <text x="320" y="82" font-family="Unbounded" font-weight="800" font-size="78" fill="currentColor">B</text>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 420 100" width="420" style="color:var(--foam)">
      <text x="0" y="82" font-family="Unbounded" font-weight="800" font-size="78" letter-spacing="-2" fill="currentColor">HOPL</text>
      <use href="#flaskA" x="247" y="10" width="70" height="82"/>
      <text x="320" y="82" font-family="Unbounded" font-weight="800" font-size="78" fill="currentColor">B</text>
    </svg>
  </div>

  <!-- 2. hoplab с шишкой вместо o -->
  <div class="cell"><div class="tag">2. Шишка хмеля вместо «o»</div>
    <svg viewBox="0 0 420 110" width="420" style="color:var(--malt)">
      <text x="0" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">h</text>
      <use href="#cone" x="56" y="22" width="56" height="74"/>
      <text x="112" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">plab</text>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 420 110" width="420" style="color:var(--foam)">
      <text x="0" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">h</text>
      <use href="#cone" x="56" y="22" width="56" height="74"/>
      <text x="112" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">plab</text>
    </svg>
  </div>

  <!-- 3. hop + пробирка-l + ab моноширинным -->
  <div class="cell"><div class="tag">3. Пробирка вместо «l»: hop — живое, lab — точное</div>
    <svg viewBox="0 0 420 110" width="420" style="color:var(--malt)">
      <text x="0" y="86" font-family="Space Grotesk" font-weight="700" font-size="92" letter-spacing="-3" fill="currentColor">hop</text>
      <use href="#tube" x="168" y="6" width="30" height="100"/>
      <text x="204" y="86" font-family="JetBrains Mono" font-weight="500" font-size="88" fill="var(--amber)">ab</text>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 420 110" width="420" style="color:var(--foam)">
      <text x="0" y="86" font-family="Space Grotesk" font-weight="700" font-size="92" letter-spacing="-3" fill="currentColor">hop</text>
      <use href="#tube" x="168" y="6" width="30" height="100"/>
      <text x="204" y="86" font-family="JetBrains Mono" font-weight="500" font-size="88" fill="var(--amber)">ab</text>
    </svg>
  </div>

  <!-- 4. эмблема-этикетка -->
  <div class="cell"><div class="tag">4. Эмблема-этикетка со слоганом по кругу</div>
    <svg viewBox="0 0 200 200" width="200" style="color:var(--malt)">
      <circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="100" cy="100" r="66" fill="none" stroke="currentColor" stroke-width="2"/>
      <path id="arc" d="M100 100 m-80 0 a80 80 0 1 1 160 0 a80 80 0 1 1 -160 0" fill="none"/>
      <text font-family="Unbounded" font-weight="600" font-size="12.5" letter-spacing="2.2" fill="currentColor"><textPath href="#arc" startOffset="2%">ЛАБОРАТОРИЯ ДОМАШНЕГО ПИВОВАРА · С 2026 ·</textPath></text>
      <text x="100" y="116" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="27" letter-spacing="-0.5" fill="currentColor">HOPL<tspan fill="var(--amber)">A</tspan>B</text>
      <use href="#cone" x="88" y="52" width="24" height="32"/>
      <path d="M62 128 H138" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <svg viewBox="0 0 200 200" width="200" style="color:var(--foam)">
      <circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="100" cy="100" r="66" fill="none" stroke="currentColor" stroke-width="2"/>
      <path id="arc2" d="M100 100 m-80 0 a80 80 0 1 1 160 0 a80 80 0 1 1 -160 0" fill="none"/>
      <text font-family="Unbounded" font-weight="600" font-size="12.5" letter-spacing="2.2" fill="currentColor"><textPath href="#arc2" startOffset="2%">ЛАБОРАТОРИЯ ДОМАШНЕГО ПИВОВАРА · С 2026 ·</textPath></text>
      <text x="100" y="116" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="27" letter-spacing="-0.5" fill="currentColor">HOPL<tspan fill="var(--amber)">A</tspan>B</text>
      <use href="#cone" x="88" y="52" width="24" height="32"/>
      <path d="M62 128 H138" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- в шапке сайта -->
  <div class="cell"><div class="tag">Так в шапке сайта (высота 32 px)</div>
    <div class="header">
      <svg viewBox="0 0 420 100" height="32" style="color:var(--malt)"><text x="0" y="82" font-family="Unbounded" font-weight="800" font-size="78" letter-spacing="-2" fill="currentColor">HOPL</text><use href="#flaskA" x="247" y="10" width="70" height="82"/><text x="320" y="82" font-family="Unbounded" font-weight="800" font-size="78" fill="currentColor">B</text></svg>
      <small>Лаборатория домашнего пивовара</small>
    </div>
    <div class="header">
      <svg viewBox="0 0 420 110" height="34" style="color:var(--malt)"><text x="0" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">h</text><use href="#cone" x="56" y="22" width="56" height="74"/><text x="112" y="88" font-family="Fraunces" font-weight="800" font-size="96" fill="currentColor">plab</text></svg>
      <small>Рецепты. Расчёты. Варка.</small>
    </div>
  </div>
  <div class="cell dark"><div class="tag">&nbsp;</div>
    <div class="header">
      <svg viewBox="0 0 420 110" height="34" style="color:var(--foam)"><text x="0" y="86" font-family="Space Grotesk" font-weight="700" font-size="92" letter-spacing="-3" fill="currentColor">hop</text><use href="#tube" x="168" y="6" width="30" height="100"/><text x="204" y="86" font-family="JetBrains Mono" font-weight="500" font-size="88" fill="var(--amber)">ab</text></svg>
      <small>Лаборатория домашнего пивовара</small>
    </div>
  </div>
</div>
</body>
</html>
