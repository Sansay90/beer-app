# Миграции схемы Postgres. Адрес базы — DATABASE_URL (окружение или service/.env), см. migrations/env.py.
# Новая миграция после правки app/models.py:  alembic revision --autogenerate -m "что изменилось"
# Применяются сами при старте сервиса; вручную:  alembic upgrade head
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
